[project]
name = "livemoments-local"
version = "0.1.0"
description = "Pinned offline LiveMoments inference with workspace-backed uv storage"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "diffusers==0.32.2",
  "transformers==4.42.4",
  "peft==0.10.0",
  "accelerate==1.12.0",
  "numpy==1.24.4",
  "scipy==1.10.1",
  "opencv-python-headless==4.9.0.80",
  "matplotlib==3.7.5",
  "pillow==10.3.0",
  "PyYAML==6.0.3",
  "huggingface-hub==0.36.2",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "protobuf==6.33.5",
  "gdown==5.2.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
